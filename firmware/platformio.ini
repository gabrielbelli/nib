; N.I.B. - ESP32-S3 dongle: BLE GATT peripheral -> USB HID keyboard and mouse
;
; Two environments: the Pocket-Dongle this was built on, and generic-s3 for any
; other ESP32-S3. Everything else (pins, screen, button, setting defaults) is a
; -D flag; every value in src/config.h is guarded by #ifndef.

[platformio]
default_envs = pocket-dongle-s3

[base]
platform  = espressif32@^6.9.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode   = qio
board_build.partitions   = default_16MB.csv
board_upload.flash_size  = 16MB

build_unflags = -DARDUINO_USB_MODE=1

build_flags =
  -DARDUINO_USB_MODE=0          ; TinyUSB OTG stack, required for HID
  -DARDUINO_USB_CDC_ON_BOOT=0   ; the console is created in firmware, not by the core
  -DCORE_DEBUG_LEVEL=2
  -DUSB_PRODUCT=\"N.I.B.\"
  -DCONFIG_BT_NIMBLE_MAX_BONDS=8 ; NimBLE keeps 3 by default, so a phone, a laptop and a
                                ; tablet evicted each other and every connect asked for the PIN again
  -DUSB_MANUFACTURER=\"nib\"

lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
  adafruit/Adafruit GFX Library@^1.11.11

extra_scripts = pre:reset_to_bootloader.py
monitor_speed = 115200

; ---------------------------------------------------------------- boards ----

; Pocket-Dongle-S3-0.96. ST7735 160x80, backlight hardwired on.
[env:pocket-dongle-s3]
extends = base

; Any other ESP32-S3. Assumes no screen and no button, which can never lock
; you out: the passkey goes to the serial console, every plug-in opens a
; pairing window, and the console stays on for reflashing. Screens and buttons
; are flags (see README, "Build flags").
[env:generic-s3]
extends = base
; 4 MB layout: boots on any S3 with 4 MB of flash or more.
board_build.partitions  = default.csv
board_upload.flash_size = 4MB
build_flags = ${base.build_flags}
  -DNIB_LCD_ENABLED=0
  -DNIB_BTN_PIN=-1
